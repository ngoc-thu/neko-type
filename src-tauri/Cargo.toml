[package]
name = "neko-type"
version = "1.0.0"
description = "NekoType - Cute Anime Typing Desktop Companion for Ubuntu GNOME"
authors = ["Ngoctien"]
edition = "2021"

[lib]
name = "neko_type_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rdev = "0.5.3"
dirs = "5.0"
x11 = { version = "2.21", features = ["xlib"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
